<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
    <script src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.4/kakao.min.js"></script>
    <title>놀고정산</title>
    <!-- Live CodePush JS Bootstrapper -->
    <script>
      (function() {
        var defaultJs = "./assets/index-BvYiTCmt.js";
        var liveJs = localStorage.getItem("nolgo_live_js_url");
        var jsUrl = liveJs || defaultJs;
        var script = document.createElement("script");
        script.type = "module";
        script.crossOrigin = "";
        script.src = jsUrl;
        script.onerror = function() {
          if (jsUrl !== defaultJs) {
            console.warn("[LiveSync] Failed to load remote bundle, falling back to local asset:", defaultJs);
            localStorage.removeItem("nolgo_live_js_url");
            localStorage.removeItem("nolgo_live_css_url");
            var fb = document.createElement("script");
            fb.type = "module";
            fb.crossOrigin = "";
            fb.src = defaultJs;
            document.body.appendChild(fb);
          }
        };
        document.body.appendChild(script);
      })();
    </script>
    <!-- Live CodePush CSS Bootstrapper -->
    <script>
      (function() {
        var defaultCss = "./assets/index-3mkybgbE.css";
        var liveCss = localStorage.getItem("nolgo_live_css_url");
        var cssUrl = liveCss || defaultCss;
        var link = document.createElement("link");
        link.rel = "stylesheet";
        link.crossOrigin = "";
        link.href = cssUrl;
        link.onerror = function() {
          if (cssUrl !== defaultCss) {
            console.warn("[LiveSync] Failed to load remote CSS, falling back to local asset:", defaultCss);
            var fb = document.createElement("link");
            fb.rel = "stylesheet";
            fb.crossOrigin = "";
            fb.href = defaultCss;
            document.head.appendChild(fb);
          }
        };
        document.head.appendChild(link);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
  </body>
</html>
