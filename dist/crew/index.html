<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <script>
      // KakaoTalk's in-app browser intercepts every tapped link and renders
      // it in its own WebView instead of handing off to the OS — Android
      // never gets the chance to apply the app's App Links intent-filter,
      // so an invite link just opens the website instead of the app.
      // KakaoTalk recognizes this custom scheme as "break out to an
      // external browser/app", which does trigger normal Android link
      // resolution (and therefore the installed app, if verified for this
      // domain). Must run before anything else loads.
      (function () {
        if (/KAKAOTALK/i.test(navigator.userAgent || "")) {
          location.href = "kakaotalk://web/openExternal?url=" + encodeURIComponent(location.href);
        }
      })();
    </script>
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
